services:
  dev-db:
    image: postgres:16-alpine
    container_name: progetto-nextjs-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: progetto-nextjs-backend
    ports:
      - '3333:3333'
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:123@dev-db:5432/nest
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./apps/backend/package.json:/app/apps/backend/package.json
      - ./apps/backend/nest-cli.json:/app/apps/backend/nest-cli.json
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json
      - ./apps/backend/tsconfig.build.json:/app/apps/backend/tsconfig.build.json
      - ./apps/backend/prisma.config.ts:/app/apps/backend/prisma.config.ts
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./apps/backend/test:/app/apps/backend/test
      - ./apps/backend/scripts:/app/apps/backend/scripts
      - ./apps/backend/uploads:/app/apps/backend/uploads
    depends_on:
      dev-db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: progetto-nextjs-frontend
    ports:
      - '3000:3000'
    environment:
      BACKEND_URL: http://backend:3333
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3333
      NEXT_TELEMETRY_DISABLED: '1'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./apps/frontend/package.json:/app/apps/frontend/package.json
      - ./apps/frontend/next.config.ts:/app/apps/frontend/next.config.ts
      - ./apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json
      - ./apps/frontend/postcss.config.mjs:/app/apps/frontend/postcss.config.mjs
      - ./apps/frontend/components.json:/app/apps/frontend/components.json
      - ./apps/frontend/app:/app/apps/frontend/app
      - ./apps/frontend/components:/app/apps/frontend/components
      - ./apps/frontend/features:/app/apps/frontend/features
      - ./apps/frontend/lib:/app/apps/frontend/lib
      - ./apps/frontend/providers:/app/apps/frontend/providers
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/styles:/app/apps/frontend/styles
      - ./apps/frontend/types:/app/apps/frontend/types
      - ./apps/frontend/db:/app/apps/frontend/db
      - ./apps/frontend/e2e:/app/apps/frontend/e2e
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
